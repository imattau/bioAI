[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioai"
version = "0.1.0"
description = "Biologically grounded architecture for reasoning AI beyond the transformer"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "pandas",
    "networkx",
    "tqdm",
    "torch-hd>=5.0",
    "gymnasium>=1.0",
    "matplotlib",
    "lemminflect",
    "pytest>=9.0",
    "pytest-cov",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipywidgets",
]
notebook = [
    "jupyter",
    "ipywidgets",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
